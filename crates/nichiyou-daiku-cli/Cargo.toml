[package]
name = "nichiyou-daiku-cli"
description = "The nichiyou-daiku command line: validate, report on and draw furniture designs (.nd)"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "nichiyou-daiku"
path = "src/main.rs"

[dependencies]
nichiyou-daiku-core = { path = "../nichiyou-daiku-core" }
nichiyou-daiku-drawing = { path = "../nichiyou-daiku-drawing" }
nichiyou-daiku-export = { path = "../nichiyou-daiku-export" }
clap = { version = "4", features = ["derive"] }
jiff = "0.2"
resvg = { version = "0.45", default-features = false, features = ["text", "system-fonts"] }
svg2pdf = { version = "0.13", default-features = false, features = ["text"] }
tiny_http = "0.12"
serde_json = { version = "1", features = ["preserve_order"] }
toml = { version = "0.9", features = ["preserve_order"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
ttf-parser = "0.25"
