[package]
name = "nichiyou-daiku-cli"
description = "The nichiyou-daiku command line: validate and report on furniture designs (.nd)"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "nichiyou-daiku"
path = "src/main.rs"

[dependencies]
nichiyou-daiku-core = { path = "../nichiyou-daiku-core" }
clap = { version = "4", features = ["derive"] }
jiff = "0.2"
serde_json = { version = "1", features = ["preserve_order"] }
toml = { version = "0.9", features = ["preserve_order"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
