[package]
name = "nichiyou-daiku-core"
description = "Placement, joinery and checks for nichiyou-daiku furniture designs (.nd)"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
# Keys keep the order they are put in, as the Python version prints them
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
toml = "0.9"
