[package]
name = "nichiyou-daiku-core"
description = "Placement, joinery and checks for nichiyou-daiku furniture designs (.nd)"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
# Keys keep the order they are put in, so a report reads the same each time
serde_json = { version = "1", features = ["preserve_order"] }

